name: CI
on: [push, pull_request]
jobs:
  windows-app:
    name: Windows app (C# / WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build WaterCa7sPcCleaner.sln -c Release
      - run: dotnet test WaterCa7sPcCleaner.sln -c Release --no-build
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.3 -y --no-progress
          }
      - name: Build the setup
        shell: pwsh
        run: ./tools/build-installer.ps1
      - name: Install, update and uninstall it
        shell: pwsh
        timeout-minutes: 20
        run: ./tools/test-installer.ps1 -Setup publish/WaterCa7sPcCleaner-Setup.exe
      - name: Update manifest dry run (throwaway key)
        shell: pwsh
        run: |
          $key = [System.Security.Cryptography.ECDsa]::Create([System.Security.Cryptography.ECCurve+NamedCurves]::nistP256)
          $env:UPDATE_SIGNING_KEY = $key.ExportECPrivateKeyPem()
          $public = $key.ExportSubjectPublicKeyInfoPem()
          ./tools/make-update-manifest.ps1 -Version 9.9.9 -Setup publish/WaterCa7sPcCleaner-Setup.exe -NotesFile docs/release-notes/1.1.0.md -OutDir dryrun -PublicKeyPem $public
          Set-Content dryrun/public.pem $public
          $env:UPDATE_MANIFEST_DIR = (Resolve-Path dryrun).Path
          dotnet test tests/PcCleaner.Tests -c Release --no-build --filter "FullyQualifiedName~ScriptManifest_IsAcceptedByTheApp"
      - uses: actions/upload-artifact@v4
        with:
          name: WaterCa7sPcCleaner-Setup
          path: publish/WaterCa7sPcCleaner-Setup.exe

  python-cli:
    name: Console version (Python)
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Full scan smoke test
        run: python -m pccleaner scan --quick --html report.html --json report.json
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          path: cli-python/report.*
